plugins {
    id 'com.android.application' version '9.3.1'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    String TAG = ""
    String semVer = "1.1.7"
    // Used by the fallback for github actions
    String TAG_PART_COMMIT = ""
    String TAG_STRING

    try {
        TAG = providers.exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue = true
        }.getStandardOutput().asText.get()
    } catch (Exception e) {
        e.printStackTrace()
    }

    // Fallback for action builds
    if (TAG.toString().trim().isEmpty()) {
        try {
            TAG_PART_COMMIT = providers.exec {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue = true
            }.getStandardOutput().asText.get()
        } catch (Exception ignored) {
        }
    }


    if(!TAG.isBlank()){
        TAG_STRING = TAG
    }else {
        if(TAG_PART_COMMIT.isBlank()){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'amethyst-legacy-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if(!isRelease){
        return TAG_STRING.trim().replace("-g", "-") + "-" + "debug-" + semVer
    }else {
        return TAG_STRING.trim().replace("-g", "-") + "-" + "release-" + semVer
    }
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 37


    signingConfigs {
        penguRelease {
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        customRelease {
            storeFile file("aamc_upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "android_github_release"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "xyz.penguscraft.launcher"
        minSdkVersion 21
        targetSdkVersion 34
        // Pengu surumu pengu-surum.properties'te; otomatik guncelleme versionCode'a bakar
        def surum = new Properties()
        rootProject.file("pengu-surum.properties").withInputStream { surum.load(it) }
        versionCode surum['versionCode'].toInteger()
        versionName surum['versionName']
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
        // Pengu: sadece telefon islemcileri. x86/x86_64 yalnizca emulator/Chromebook icin,
        // APK'yi ~40 MB buyutuyordu.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    androidResources {
        // Varsayilan desen + x86 LWJGL native klasorleri (abiFilters asset'lere uygulanmiyor)
        ignoreAssetsPattern '!.svn:!.git:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~:<dir>x86:<dir>x86_64'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "Pengu Launcher (Debug)"
            resValue "string", "app_short_name", "Pengu (Debug)"
            resValue 'string', 'application_package', 'xyz.penguscraft.launcher.debug'
            resValue 'string', 'storageProviderAuthorities', 'xyz.penguscraft.launcher.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'xyz.penguscraft.launcher.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.penguRelease
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue "string", "app_name", "Pengu Launcher"
            resValue "string", "app_short_name", "Pengu Launcher"
            resValue 'string', 'storageProviderAuthorities', 'xyz.penguscraft.launcher.scoped.gamefolder'
            resValue 'string', 'application_package', 'xyz.penguscraft.launcher'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // If you're debugging mesa libs, put them here, android will strip them
            // and not properly link to source files, very smart android studio.
            keepDebugSymbols += ['**/libcutils.so']
            pickFirsts += ['**/libbytehook.so']
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

afterEvaluate {
    def componentJars = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":MioLibPatcher:jar",
            ":jre_lwjgl3glfw:jar"
    ]

    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t ->
        t.dependsOn(componentJars)
    }

    // Needed or else the release builds complain about undeclared dependencies
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t ->
        t.dependsOn(componentJars)
    }
}

